global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: tracemet

scrape_configs:
  # Prometheus itself (resolved via Docker-internal DNS, not localhost).
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Example: scrape an app running on the HOST (outside this compose).
  # host.docker.internal resolves to the host from inside containers.
  # - job_name: host-app
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]

  # Application metrics converted from OTLP by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]   # OTLP->Prom exporter
      - targets: ["otel-collector:8888"]   # collector self-metrics

  # Host metrics.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8088"]

  # Tempo internal metrics (also receives span-metrics via remote_write).
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # Loki internal metrics.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
