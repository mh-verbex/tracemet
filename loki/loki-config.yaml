auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  metric_aggregation_enabled: true
  # Allow OTLP structured metadata (trace_id etc.) for log<->trace correlation.
  allow_structured_metadata: true
  volume_enabled: true

# Enable the native OTLP endpoint (/otlp/v1/logs) used by the collector.
querier:
  max_concurrent: 4
